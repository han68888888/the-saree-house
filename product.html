<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saree — The Saree House</title>
  <meta name="description" content="Saree details, fabric, reviews, delivery estimate and easy WhatsApp checkout at The Saree House.">
  <meta name="theme-color" content="#F8F3EA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.pexels.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450..650&family=Karla:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/brand/favicon.svg">
</head>
<body data-page="product">

  <main id="main">
    <div class="page pdp" id="pdp-root">
      <!-- rendered by js/product.js -->
    </div>

    <section class="section section--tight section--silk" id="related-wrap">
      <div class="page">
        <div class="section-head reveal">
          <div><span class="eyebrow">You may also like</span><h2 id="rel-coll-title">Pairs well with your taste</h2></div>
          <a class="btn--line" id="rel-coll-viewall" href="shop.html">View all</a>
        </div>
        <div class="prod-rail prod-rail--s" id="related-rail" tabindex="0" aria-label="Related sarees, scroll horizontally"></div>
      </div>
    </section>

    <section class="section section--tight" id="related-occ-wrap">
      <div class="page">
        <div class="section-head reveal">
          <div><span class="eyebrow">Same occasion</span><h2 id="rel-occ-title">More for the occasion</h2></div>
          <a class="btn--line" id="rel-occ-viewall" href="shop.html">View all</a>
        </div>
        <div class="prod-rail prod-rail--s" id="related-occ-rail" tabindex="0" aria-label="Sarees for the same occasion, scroll horizontally"></div>
      </div>
    </section>
  </main>

  <!-- sticky mobile buy bar -->
  <div class="stickybar" id="stickybar" aria-hidden="true"></div>

  <!-- zoom lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zoomed saree photo">
    <div class="lightbox__bar">
      <button class="icon-btn" type="button" id="lightbox-close" aria-label="Close zoom"></button>
    </div>
    <div class="lightbox__stage" id="lightbox-stage">
      <img src="" alt="">
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
